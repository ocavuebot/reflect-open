name: Linux watcher review
on:
  workflow_dispatch:
  push:
    branches: [review-1742-linux]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: team-reflect/reflect-open
          ref: b010353e72d28b8faa0b3cb49c7aac5ff695ffda
          path: source
          persist-credentials: false
      - run: python3 extract.py
      - run: cargo test --manifest-path probe/Cargo.toml -- --nocapture --test-threads=1
